<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#120b08" />
    <title>Çevrimdışı | ShineQR</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 0,#7b17231f,transparent 42%),#f7f1e8;color:#2f211c;font-family:system-ui,sans-serif}.card{width:min(100%,520px);display:grid;justify-items:center;gap:16px;padding:clamp(28px,8vw,54px);border:1px solid #d8c8b5;border-radius:24px;background:#fffaf3;text-align:center;box-shadow:0 24px 70px #38251b1c}.card img{width:88px;height:88px;border-radius:22px}.eyebrow{margin:2px 0 0;color:#8d5d20;font-size:11px;font-weight:800;letter-spacing:.2em}.card h1{margin:0;font:clamp(30px,8vw,48px)/1.02 Georgia,serif}.copy{max-width:410px;color:#75675c;font-size:14px;line-height:1.7}.actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.actions button,.actions a{min-height:48px;display:grid;place-items:center;padding:12px 16px;border:1px solid #7b1723;border-radius:12px;font:700 13px/1 system-ui,sans-serif;text-decoration:none;cursor:pointer}.actions button{background:#7b1723;color:#fff}.actions a{background:transparent;color:#7b1723}@media(max-width:430px){.actions{grid-template-columns:1fr}.card{border-radius:18px}}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/pwa/icon-192.png" alt="" />
      <p class="eyebrow">BAĞLANTI KESİLDİ</p>
      <h1>İnternet bağlantınızı kontrol edin</h1>
      <p class="copy">Özel albümler ve yönetim verileri güvenliğiniz için çevrimdışı saklanmaz. Bağlantınız geldiğinde kaldığınız yerden devam edebilirsiniz.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Sayfayı yenile</button>
        <a href="/">Ana sayfaya dön</a>
      </div>
    </main>
  </body>
</html>
